server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service so the frontend can be built
    # once with a relative API base URL when served via this container
    # (docker-compose sets VITE_API_BASE_URL at build time instead, but this
    # proxy is kept as a convenience/fallback for same-origin deployments).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
